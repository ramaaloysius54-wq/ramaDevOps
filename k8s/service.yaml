apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  selector:
    app: web-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: bot-service
spec:
  selector:
    app: bot-engine
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
