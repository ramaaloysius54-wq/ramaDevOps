apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: web-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: bot-service
spec:
  selector:
    role: bot-engine
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
