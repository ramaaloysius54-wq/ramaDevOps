apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-dashboard
  template:
    metadata:
      labels:
        app: web-dashboard
    spec:
      containers:
      - name: web
        image: ramaaloysius/rama-app:latest
        imagePullPolicy: Always
        command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-engine
  template:
    metadata:
      labels:
        app: bot-engine
    spec:
      containers:
      - name: bot
        image: ramaaloysius/rama-app:latest
        imagePullPolicy: Always
        command: ["sh", "-c", "npm run bot:start"]
        ports:
        - containerPort: 4000
        resources:
          limits:
            memory: "256Mi"
            cpu: "300m"