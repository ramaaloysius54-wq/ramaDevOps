name: CI/CD Pipeline Rama DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🚀 Deploy to VPS via SSHPass
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "❌ ERROR: Secret VPS_HOST, VPS_USER, atau VPS_PASSWORD kosong!"
            echo "Pastikan disimpan di Repository Secrets, bukan Environment Secrets."
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password,keyboard-interactive -p 22 "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            echo "Memulai Deployment di VPS..."
            cd /var/www/rama_bot
            git reset --hard HEAD
            git pull origin main
            npm install
            npx prisma generate
            pm2 restart ramabot
            echo "Deployment Sukses!"
          ENDSSH
