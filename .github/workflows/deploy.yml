name: CI/CD Pipeline Rama DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: rama DevOps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Clean Install & Build (Di GitHub)
        run: |
          npm ci
          npx prisma generate
          npm run build --if-present
          npm run bot:build --if-present

      - name: 🚀 Sync & Restart di VPS (/var/www/rama_bot)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          
          echo "1. Mengirim file terbaru ke VPS..."
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='baileys_auth_info' \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 20198" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/rama_bot/"
          
          echo "2. Install module & Restart PM2 di VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 20198 "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.npm-global/bin
            cd /var/www/rama_bot
            
            npm ci
            npx prisma generate
            
            pm2 restart all
            pm2 save
          ENDSSH

      - name: ☸️ Deploy & Rollout Kubernetes (K3s) di VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "3. Menjalankan Orkestrasi Pods Kubernetes (K3s)..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 20198 "$VPS_USER@$VPS_HOST" << 'ENDK8S'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            mkdir -p /var/www/k8s-rama
            cd /var/www/k8s-rama

            cat << 'EOF' > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: web-dashboard
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: web-dashboard
            template:
              metadata:
                labels:
                  app: web-dashboard
              spec:
                containers:
                - name: web
                  image: node:20
                  workingDir: /app
                  command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
                  ports:
                  - containerPort: 3000
                  volumeMounts:
                  - name: app-volume
                    mountPath: /app
                volumes:
                - name: app-volume
                  hostPath:
                    path: /var/www/rama_bot
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: bot-engine
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: bot-engine
            template:
              metadata:
                labels:
                  app: bot-engine
              spec:
                containers:
                - name: engine
                  image: node:20
                  workingDir: /app
                  command: ["sh", "-c", "npm run bot:build && node dist-bot/bot-service/server.js"]
                  ports:
                  - containerPort: 4000
                  volumeMounts:
                  - name: app-volume
                    mountPath: /app
                volumes:
                - name: app-volume
                  hostPath:
                    path: /var/www/rama_bot
          EOF

            cat << 'EOF' > service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: web-service
          spec:
            selector:
              app: web-dashboard
            ports:
              - protocol: TCP
                port: 80
                targetPort: 3000
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: bot-service
          spec:
            selector:
              app: bot-engine
            ports:
              - protocol: TCP
                port: 4000
                targetPort: 4000
          EOF

            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml
            kubectl rollout restart deployment/web-dashboard
            kubectl rollout restart deployment/bot-engine
            sleep 5
            kubectl get pods -o wide
            kubectl get svc
          ENDK8S