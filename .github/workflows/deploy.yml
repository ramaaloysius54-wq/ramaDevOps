      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }} # 👈 Ganti parameter 'password' menjadi 'key'
          port: 22
          script_stop: true
          script: |
            echo "Memulai Deployment di VPS..."
            cd /var/www/rama_bot
            git reset --hard HEAD
            git pull origin main
            npm install
            npx prisma generate
            pm2 restart ramabot
            echo "Deployment Sukses!"
