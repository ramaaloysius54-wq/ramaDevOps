name: CI/CD Pipeline Rama DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: rama DevOps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Clean Install & Build (Di GitHub)
        run: |
          npm ci
          npx prisma generate
          npm run build --if-present
          npm run bot:build --if-present

      - name: 🚀 Sync & Restart di VPS (/var/www/rama_bot)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          
          echo "1. Mengirim file terbaru ke VPS..."
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='baileys_auth_info' \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 20198" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/rama_bot/"
          
          echo "2. Install module & Restart PM2 di VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 20198 "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.npm-global/bin
            cd /var/www/rama_bot
            
            npm ci
            npx prisma generate
            npm run bot:build --if-present
            
            pm2 stop all || true
            pm2 save
          ENDSSH

      - name: ☸️ Deploy & Rollout Kubernetes (K3s) di VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "3. Menjalankan Orkestrasi Pods Kubernetes (K3s)..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 20198 "$VPS_USER@$VPS_HOST" << 'ENDK8S'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            mkdir -p /var/www/k8s-rama
            cd /var/www/k8s-rama

            # Hapus deployment bot-engine lama yang terpisah agar tidak bentrok sesi WA
            kubectl delete deployment bot-engine --ignore-not-found=true

            cat << 'EOF' > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: web-dashboard
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: web-dashboard
                role: bot-engine
            template:
              metadata:
                labels:
                  app: web-dashboard
                  role: bot-engine
              spec:
                enableServiceLinks: false
                containers:
                - name: web
                  image: node:20
                  workingDir: /app
                  command: ["sh", "-c", "npm run start"]
                  ports:
                  - containerPort: 3000
                  env:
                  - name: HOSTNAME
                    value: "0.0.0.0"
                  - name: HOST
                    value: "0.0.0.0"
                  - name: PORT
                    value: "3000"
                  - name: BOT_SERVICE_PORT
                    value: "4000"
                  - name: BOT_PORT
                    value: "4000"
                  volumeMounts:
                  - name: app-volume
                    mountPath: /app
                - name: engine
                  image: node:20
                  workingDir: /app
                  command: ["sh", "-c", "npm run bot:build && (node dist-bot/server.js || node dist-bot/bot-service/server.js)"]
                  ports:
                  - containerPort: 4000
                  env:
                  - name: PORT
                    value: "4000"
                  - name: BOT_SERVICE_PORT
                    value: "4000"
                  volumeMounts:
                  - name: app-volume
                    mountPath: /app
                volumes:
                - name: app-volume
                  hostPath:
                    path: /var/www/rama_bot
          EOF

            cat << 'EOF' > service.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: web-service
          spec:
            type: NodePort
            selector:
              app: web-dashboard
            ports:
              - protocol: TCP
                port: 80
                targetPort: 3000
                nodePort: 30080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: bot-service
          spec:
            selector:
              role: bot-engine
            ports:
              - protocol: TCP
                port: 4000
                targetPort: 4000
          EOF

            cat << 'EOF' > ingress.yaml
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: rama-ingress
            annotations:
              ingress.kubernetes.io/ssl-redirect: "false"
          spec:
            rules:
            - host: tabunganrama.my.id
              http:
                paths:
                - path: /api/bot
                  pathType: Prefix
                  backend:
                    service:
                      name: bot-service
                      port:
                        number: 4000
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: web-service
                      port:
                        number: 80
          EOF

            kubectl apply -f deployment.yaml
            kubectl apply -f service.yaml
            kubectl apply -f ingress.yaml
            kubectl rollout restart deployment/web-dashboard
            sleep 8
            kubectl get pods -o wide
            kubectl get svc
          ENDK8S
