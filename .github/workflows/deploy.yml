name: CI/CD Pipeline Rama DevOps

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: rama DevOps
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧪 Clean Install & Build (Di GitHub)
        run: |
          npm ci
          npx prisma generate
          npm run build --if-present
          npm run bot:build --if-present

      - name: 🚀 Sync & Build di VPS (/var/www/rama_bot)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          echo "1. Mengirim file terbaru (termasuk folder k8s/) ke VPS..."
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='baileys_auth_info' \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/rama_bot/"

          echo "2. Install module & Build Bot di VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.npm-global/bin
            cd /var/www/rama_bot

            npm ci
            npx prisma generate
            npm run bot:build --if-present

            pm2 stop all || true
            pm2 save || true
          ENDSSH

      - name: ☸️ Auto-Sync ArgoCD & Rollout K3s (/var/www/rama_bot/k8s)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "3. Menjalankan Auto-Sync ArgoCD & Rollout Pods K3s..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 "$VPS_USER@$VPS_HOST" << 'ENDK8S'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

           

            # Hapus deployment bot-engine lama yang terpisah agar tidak bentrok sesi WA
            kubectl delete deployment bot-engine --ignore-not-found=true

            # Masuk ke folder k8s utama di dalam project rama_bot
            cd /var/www/rama_bot/k8s

            # Terapkan konfigurasi ArgoCD Application & manifest dari folder k8s/
            kubectl apply -f app-ramabot.yaml
            kubectl apply -f service.yaml
            kubectl apply -f ingress.yaml
            kubectl apply -f deployment.yaml || (kubectl delete -f deployment.yaml && kubectl apply -f deployment.yaml)

            # Pastikan fitur Auto-Sync & Self-Heal ArgoCD selalu aktif
            kubectl patch application rama-bot-gitops -n argocd --type merge -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' || true
            kubectl annotate application rama-bot-gitops -n argocd argocd.argoproj.io/refresh="hard" --overwrite || true

            # Restart deployment agar pod memuat hasil build terbaru dari /var/www/rama_bot
            kubectl rollout restart deployment/web-dashboard
            sleep 8

            kubectl get applications -n argocd
            kubectl get pods -l app=web-dashboard -o wide
            kubectl get svc web-service bot-service
            kubectl get ingress rama-ingress
          ENDK8S
